name: llm_env
# PyTorch は cu128 (Blackwell sm_120 native) を pip で導入。
# conda の pytorch-cuda メタパッケージは 12.4 までしか無いため。
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Common scientific stack (PyTorch 抜き)
  - numpy
  - pandas
  - scipy
  - pyarrow
  - protobuf
  - einops
  - scikit-learn
  - pyyaml
  - requests
  - tensorboard
  - matplotlib
  - seaborn
  - xarray
  - netcdf4
  - omegaconf
  - rich
  # Hugging Face / LLM tooling
  - tokenizers
  - sentencepiece
  - accelerate
  - datasets
  - safetensors
  - huggingface_hub
  - tqdm
  - psutil
  - pip
  - pip:
      # PyTorch (Blackwell sm_120 native)
      - --extra-index-url=https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
      - torchaudio
      # 既存の pip 依存
      - PyPDF2
      - pdfminer.six
      - pymupdf
      - transformers>=4.3.4
      - sentence-transformers==5.1.1
      - trl
      - evaluate
      - peft
      - optimum
      - gradio
      - tiktoken
      - hf-transfer
      - nvitop
      - bitsandbytes
      - sacrebleu
      - rouge-score
      - bert-score
      - fugashi[unidic-lite]
      - faiss-cpu
      - langchain
      - chromadb
      - wandb
      - fastapi
      - uvicorn
      - openai
      - nltk
