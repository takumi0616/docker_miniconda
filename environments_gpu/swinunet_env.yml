name: swinunet_env
# PyTorch は conda の pytorch-cuda メタパッケージが 12.4 までしか無いため、
# Blackwell sm_120 ネイティブ対応 (cu128 wheel / PyTorch 2.7+) を確実にする目的で
# pip 経由でインストールする。conda 側では PyTorch を入れない。
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # 科学計算スタック (PyTorch 抜き)
  - numpy
  - pandas
  - scikit-learn
  - xarray
  - cfgrib
  - netcdf4
  - dask
  - psutil
  - opencv
  - scikit-image
  - ffmpeg
  - matplotlib
  - seaborn
  - cartopy
  - timm
  - shap
  - einops
  - tqdm
  - h5netcdf
  - hdf5plugin
  - imageio
  - pygrib
  - pip
  - pip:
      # PyTorch (Blackwell sm_120 native: cu128 wheel)
      - --extra-index-url=https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
      - torchaudio
      # 既存の pip 依存
      - japanize-matplotlib
      - cdsapi
      - skan
      - scipy
      - numba
      - nvitop
      - imageio-ffmpeg
      - ema-pytorch
      - accelerate
      - pillow
